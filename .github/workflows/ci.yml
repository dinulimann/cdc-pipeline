name: ci
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: analytics, POSTGRES_PASSWORD: analytics, POSTGRES_DB: analytics}
        ports: ["5555:5432"]
        options: --health-cmd "pg_isready -U analytics" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -v

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Start PostgreSQL, Kafka and Debezium
        run: docker compose up -d --wait
      - run: ./scripts/register.sh
      - name: Normal traffic, then the chaos scenarios and the final comparison
        env: {PY: python, LOG: consumer.log}
        run: |
          python -m cdc.consumer >> consumer.log 2>&1 & echo $! > /tmp/cdc-consumer.pid
          python scripts/simulate.py --seconds 30 --rate 25
          ./scripts/chaos.sh
      - if: failure()
        run: tail -100 consumer.log; docker compose logs connect | tail -100
