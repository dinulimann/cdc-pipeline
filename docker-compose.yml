# Source PostgreSQL -> Debezium (Kafka Connect) -> Kafka -> Python consumer -> analytics PostgreSQL
services:
  source-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment: {POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop}
    ports: ["5554:5432"]
    volumes: ["./db/source.sql:/docker-entrypoint-initdb.d/source.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U shop"], interval: 2s, timeout: 3s, retries: 30}

  analytics-db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: analytics, POSTGRES_PASSWORD: analytics, POSTGRES_DB: analytics}
    ports: ["5555:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U analytics"], interval: 2s, timeout: 3s, retries: 30}

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  connect:
    image: quay.io/debezium/connect:3.3
    depends_on:
      kafka: {condition: service_healthy}
      source-db: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: "-Xms256m -Xmx512m"
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Optional UI for topics and messages: docker compose --profile ui up -d
  console:
    image: redpandadata/console:v3.2.2
    profiles: ["ui"]
    depends_on: [kafka]
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CONNECT_ENABLED: "true"
      KAFKA_CONNECT_CLUSTERS_NAME: connect
      KAFKA_CONNECT_CLUSTERS_URL: http://connect:8083
    ports: ["8088:8080"]
